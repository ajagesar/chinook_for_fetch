drop_ctc: false
stratified_split: false # todo: implement
oversample: false
random_state: 42
optuna_trials: 50
use_validation_set: false
use_cross_validation: true
window_in_hours: 24
assume_normal_values_for_nan: true
imputation_method: # set one of two as true, cannot be neither or both. Will be applied after previous step of setting normal values for nan
  median: true
  mice: false
optuna_jobs: -1
optuna_load_study: true

pipeline:
  save_schema: true
  extraction: false
  preprocessing_presplit: true
  splitting: true
  preprocessing_postsplit: true
  hyperparameter_tuning: false
  modeling: true
  evaluation: true
  incremental_training: true
  plotting: true

incremental_training:
  nan_origin_label: "no source recorded"
  origin_order:
  - UMC Utrecht
  - Catharina Ziekenhuis Eindhoven
  - Radboudumc
  - Franciscus Gasthuis
  - OLVG
  - Vrije Universiteit Medisch Centrum
  - Amsterdams Medisch Centrum
