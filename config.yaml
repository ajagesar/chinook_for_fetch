    # - amc_metavision
    # - aumc_epic

splitting_method:
  sklearn: false
  nice: true
  db_origin: false

model_algorithms:
  xgb:
    label: 'xgb'
    filename: 'xgb_model.pkl'
    hyperparameter_range:
      max_depth:
        label: 'max_depth'
        min: 2
        max: 32
      min_child_weight:
        label: 'min_child_weight'
        min: 1
        max: 250
      subsample:
        label: 'subsample'
        min: 0.5
        max: 1
      colsample_bytree:
        label: colsample_bytree
        min: 0.5
        max: 1
      reg_lambda:
        label: 'reg_lambda'
        min: 0.001
        max: 25
        log: True
      learning_rate:
        label: 'learning_rate'
        min: 0.001
        max: 0.99
        log: True
  logreg:
    label: 'logreg'
    filename: logreg_model.pkl
    hyperparameter_range:
      penalty:
        - l1
        - l2
        # - elasticnet
        # - None
      solver:
        # - lbfgs
        # - newton-cg
        # - liblinear
        # - sag
        - saga
      C:
        min: 0.001
        max: 1.0
        log: true
      max_iter:
        min: 100
        max: 5000
  # svm:
  #   label: 'svm'
  #   filename: svm_model.pkl
  #   hyperparameter_range:
  #     C:
  #       min: 0.1
  #       max: 1000
  #       log: true
  #     gamma:
  #       min: 0.0001
  #       max: 1
  #       log: true
  #     kernel:
  #       - rbf
  #       - sigmoid
  #       # - linear
  knn:
    label: 'knn'
    filename: knn_model.pkl
    hyperparameter_range:
      n_neighbors:
        min: 3
        max: 20
      weights:
        - uniform
        - distance
      metric:
        - minkowski
        - euclidean
        - manhattan
  naivebayes:
    label: 'naivebayes'
    filename: naivebayes_model.pkl
    hyperparameter_range:
      var_smoothing:
        min: 1.0e-12
        max: 1.0e-2
        log: true
  nn:
    label: 'nn'
    filename: nn_model.pkl
    hyperparameter_range:
      hidden_layers:
        min: 16
        max: 128
      num_layers:
        min: 1
        max: 4
      lr:
        min: 1.0e-4
        max: 1.0e-1
        log: True
      epochs:
        min: 10
        max: 50
      batch_size:
        - 16
        - 32
        - 64
  xgb_unimputed:
    label: 'xgb_unimputed'
    filename: xgb_unimputed.pkl

  
